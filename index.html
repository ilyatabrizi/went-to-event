<style>
  /* No opening sequence. The ground is painted before anything else loads so
     the first frame is already Ink — there is nothing to fade away from. */
  html,body{background:#0B0A0C;margin:0}
</style>
</head>
<body>

<div id="shell" data-hero="0" data-dock="0" data-tabs="1">
  <header id="bar" class="bar"></header>

  <main id="view" tabindex="-1"></main>

  <!-- One primary action per screen, riding above the tab bar. -->
  <div class="dock" id="dock" hidden></div>

  <nav id="tabbar" class="tabbar" aria-label="Main">
    <div class="tabs" id="tabs">
      <span class="tabs-lens" id="tabs-lens" aria-hidden="true"></span>
      <div class="tabs-row" id="tabs-row">
      <a class="tab" draggable="false" data-tab="home" href="#/"><span class="tab-ico"></span><span class="tab-label">Home</span></a>
      <a class="tab" draggable="false" data-tab="explore" href="#/explore"><span class="tab-ico"></span><span class="tab-label">Explore</span></a>
      <a class="tab" draggable="false" data-tab="chat" href="#/chat"><span class="tab-ico"></span><span class="tab-label">Chat</span></a>
      <a class="tab" draggable="false" data-tab="went" href="#/went"><span class="tab-ico"></span><span class="tab-label">Went</span></a>
      <a class="tab" draggable="false" data-tab="you" href="#/you"><span class="tab-ico"></span><span class="tab-label">You</span></a>
      </div>
    </div>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite"></div>
</div>

<script type="module" src="js/app.js"></script>
