<style>
  /* Boot only. Inline, so the mark is on screen in the first frame — before
     app.css, before a single font has landed. */
  html,body{background:#0B0A0C;margin:0}
  #boot{position:fixed;inset:0;z-index:999;display:grid;place-items:center;
    background:#0B0A0C;transition:opacity .5s cubic-bezier(.22,.61,.36,1)}
  #boot.gone{opacity:0;pointer-events:none}
  .boot-stage{width:min(42vw,164px)}
  .boot-stage svg{width:100%;height:auto;display:block}
</style>
</head>

<!-- The opening: the "e" settles, then the dot drops onto its baseline. -->
<div id="boot" role="status" aria-label="Went To Event is opening">
  <div class="boot-stage">
    <svg viewBox="0 0 1024 1024" role="img" aria-label="Went To Event">
      <g class="e-mark" transform="matrix(0.79929,0,0,-0.79929,188.694,733.403)">

      <circle class="e-dot" cx="759.43" cy="683.90" r="49.5" fill="#FF5B3D"/>
    </svg>
  </div>
</div>
