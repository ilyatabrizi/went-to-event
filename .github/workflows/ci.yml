name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip playwright

      - name: Check Python files compile
        run: python -m compileall -q serve.py e2e.py

      - name: Start local preview server
        run: |
          python3 serve.py > /tmp/went-to-event-server.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://localhost:8141/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/went-to-event-server.log
          exit 1

      - name: Run browser tests
        run: python3 e2e.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: docs/shots/
          if-no-files-found: ignore
